# DYA Studio 対応: ZMK 本体を cormoran の Custom Studio Protocol 対応 fork (main+dya) に切替え、
#   DYA Studio のモジュール群を追加する。
#   モジュールは main 追従で破壊的変更の実績があるため、動作実績のある組合せ
#   (3110/zmk_config_CLine46 v1.1.0〜, DYA Studio v2026.09.20.0 で確認) と同じコミット SHA で固定する。
#   Zephyr は zmk 側の app/west.yml から入る (v4.1.0+zmk-fixes)。
manifest:
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: caksoylar
      url-base: https://github.com/caksoylar
  projects:
    # ZMK 本体: main+dya @ 2026-07-25
    - name: zmk
      remote: cormoran
      revision: e5c9b6915b56801193e359dd9bad4a167ce0d1b8
      import: app/west.yml

    # --- コアモジュール (他モジュールの依存) ---------------------------------
    # 設定の保存先 (マクロ/コンボ/トラックボール設定が使う)
