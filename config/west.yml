    - name: zmk-feature-fast-keymap
      remote: cormoran
      revision: 8dac76de0ba38588ba39ca498910e24f8332bc6b

    # --- Trackball タブ -------------------------------------------------------
    # PMW3610 ドライバ (Studio RPC 付き)。compatible = "cormoran,pmw3610"。
