# NFC ピンの GPIO 化は Zephyr 4.1 で Kconfig から devicetree (&uicr) に移った → LiNEA40.dtsi

# Mouse Emulation
CONFIG_ZMK_POINTING=y

# ========================================
# Trackball (cormoran 版 PMW3610 ドライバ, Studio RPC 付き)
# ========================================
# ここの値は工場出荷値。DYA Studio (Trackball タブ → PMW3610 Drivers) で保存した値が
#   起動時にその上に乗る。CPI は overlay の cpi = <...> で指定する。
# 旧 inorichi 版との対応: ORIENTATION_0 + INVERT_X=y + INVERT_Y=y と同じ向きにするには
#   cormoran 版では INVERT_X=n / INVERT_Y=y (inorichi は ORIENTATION_0 で X を先に反転していたため)。
#   実機で逆なら下を切替えるか Studio で反転する。
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_Y=y
# CONFIG_PMW3610_SWAP_XY=y
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=200
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
# センサー設定を Studio から変更 (サブシステム全体がロック対象: 読むだけでも &studio_unlock が要る)
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
# Runtime Input Processor: 感度・回転・スクロール・オートマウス (Temp-Layer) を Studio から変更
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# ========================================
# Battery / LED
# ========================================
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# ========================================
# ZMK Studio (必須ベース)
# ========================================
CONFIG_ZMK_STUDIO=y
# Zephyr 4.1 では CONSOLE が既定で有効になるが使っていないので落とす
CONFIG_CONSOLE=n
# 注意: CONFIG_ZMK_STUDIO_LOCKING=n にしない (BLE 経由の Studio 接続に Locking が必要)
# BLE 接続スロット (プロファイル 5 + Peripheral + Studio)
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
# 無線 (BLE) で Studio に繋ぐ。&studio_unlock を押すと対象プロファイルへ directed advertising が出る。
#   BLE で繋ぐときは USB を抜く (RPC は選択中のエンドポイントにしか応答しない)
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y
# Studio 接続中だけ応答間隔を詰める。サブシステムが多いと既定 (10) では接続 5 秒でタイムアウトする。
#   効くのは Studio 接続中だけなので普段の電池持ちには影響しない
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=0

# ========================================
# DYA Studio 用の設定 (Central 側)
# ========================================
# BLE 管理 (Connection タブ: プロファイル改名/切替/解除、出力優先度)
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
# Settings RPC (Settings タブ: 左右のアイドル/スリープ)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
# Split イベントリレー (Central <-> Peripheral の設定同期)
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
# Custom Settings (マクロ/コンボ/トラックボール設定の保存先)。
#   settings_load() がメインスレッドで走り、保存済み設定があると既定 1024 では溢れるため MAIN_STACK を上げる
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
# Runtime Macro (Macro&Combo タブ)。マクロは Studio 上で作成し、キーには &rmacro <slot> を割り当てる
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
# マクロはビヘイビアの local ID で手順を保存するため、ID の生成方法を固定する
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
# Runtime Combo (同上)。既定のコンボは keymap の cormoran,runtime-combo-defaults で定義
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
# Input Stream (押下キーを Studio のプレビューに表示)
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
# Device Info (ビルド情報・稼働時間)
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
# Kscan Diagnostics (チャタリング診断)。左手への中継は Web UI 未対応のため切る
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=n
# Default Layer (接続先 / OS ごとの既定レイヤー)。MIN〜MAX が候補。
#   1〜6 はホールドで使うレイヤーなので既定に選ばないこと。OS 別の差分レイヤーを足したら使う
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=6
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y
# OS 判別 (USB は列挙時、BLE は GATT の読まれ方から推定)。LAYER_AUTO_SWITCH は default-layer と競合するので使わない
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
# Watchdog (フリーズ/フォールトを記録して自動再起動。記録は Troubleshooting タブ)
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
# Fast Keymap (Studio のキーマップ読み込み高速化)
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y
# Physical Layout (プレビューにトラックボールを描く。位置は LiNEA40_right.overlay の trackball_layout)
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y
# Custom Studio Protocol のモジュールを複数有効にするとスタック不足で落ちることがあるため、
#   開発者ガイドの推奨値を入れる。メモリが足りなくなったら実機で確認しながら下げる
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# 設定保存のデバウンス (ms)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
